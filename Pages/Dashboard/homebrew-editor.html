<div class="dashboard-fragment homebrew-editor-page" id="homebrew-editor-root">
  <header class="hb-ed-header">
    <a class="btn-back hb-back" href="#grimoire" data-fog-nav="#grimoire">← Homebrew</a>
    <div class="hb-ed-titles">
      <p class="hb-ed-kicker" id="hb-ed-kicker">Homebrew</p>
      <h1 class="page-title hb-ed-title" id="hb-ed-title">Loading…</h1>
    </div>
    <div class="hb-ed-tools">
      <div class="hb-save" id="hb-save" role="status" aria-live="polite"></div>
      <button type="button" class="btn btn-secondary btn-sm" id="hb-save-now" disabled>Save now</button>
    </div>
  </header>

  <div class="hb-banner" id="hb-banner" role="alert" hidden></div>

  <div class="hb-ed-layout" id="hb-ed-layout" hidden>
    <form class="hb-form" id="hb-form" novalidate onsubmit="return false" aria-label="Homebrew fields"></form>
    <aside class="hb-preview" aria-label="Preview">
      <p class="hb-preview-head"><span>Preview</span><span class="hb-preview-note">Updates as you type. Calculated numbers follow the 2024 rules.</span></p>
      <div class="compendium-page hb-preview-wrap"><article class="cmp-detail" id="hb-preview" aria-live="off"></article></div>
    </aside>
  </div>
</div>

     VS Code Live Server injects its reload script before the first closing body tag it finds. Without one it
