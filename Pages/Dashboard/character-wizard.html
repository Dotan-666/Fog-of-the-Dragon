<div class="dashboard-fragment character-wizard-page" id="character-wizard-root">
  <header class="wizard-header">
    <button type="button" class="btn-back" id="wizard-exit" data-fog-nav="#characters">Exit creator</button>
    <div>
      <h1 class="page-title">Character Creator</h1>
      <p class="page-subtitle">D&amp;D 5E (2024 Rules) — guided creation</p>
    </div>
    <label class="wizard-mode-toggle" title="Show or hide the ? explanations and step tips">
      <input type="checkbox" id="wizard-guided-mode" class="wizard-mode-input" checked />
      <span class="wizard-mode-icon" aria-hidden="true">?</span>
      <span class="wizard-mode-text"><strong>Guided mode</strong><small class="wizard-mode-state"></small></span>
      <span class="wizard-mode-switch" aria-hidden="true"><span class="wizard-mode-knob"></span></span>
    </label>
  </header>

  <div class="wizard-layout">
    <aside class="wizard-steps" id="wizard-step-list" aria-label="Creation steps"></aside>
    <div class="wizard-main">
      <div class="wizard-step-body" id="wizard-step-body"></div>
      <div class="wizard-errors" id="wizard-errors" role="alert" hidden></div>
      <footer class="wizard-footer">
        <button type="button" class="btn btn-secondary" id="wizard-back">Back</button>
        <button type="button" class="btn btn-primary" id="wizard-next">Continue</button>
      </footer>
    </div>
    <aside class="wizard-preview" id="wizard-preview" aria-label="Character preview"></aside>
  </div>
</div>
