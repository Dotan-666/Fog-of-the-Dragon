<!DOCTYPE html>

<body class="error-body">

  <main class="error-page">
    
    <!-- Visual Backdrop with FOD Dragon Watermark -->
    <div class="error-bg">
      <div class="error-dragon-artwork" style="background-image: url('../Assets/Pictures/FOD.jpg');"></div>
      <div class="error-bg-glow"></div>
      <div class="error-bg-overlay"></div>
    </div>

    <!-- Main Content Container -->
    <section class="error-container">
      
      <!-- Brand Logo Header -->
      <a class="auth-brand error-brand" href="Dashboard.html" aria-label="Fog of the Dragon Home">
        <span class="auth-brand-icon">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3L4 9L16 15L28 9L16 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17L16 23L28 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 23L16 29L28 23" stroke="#d62839" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        </span>
        <span class="auth-brand-text">Fog of the Dragon</span>
      </a>

      <!-- Card Content -->
      <div class="error-card">
        
        <div class="error-badge">
          <span class="error-code">404</span>
          <span class="error-dice-tag">Roll for Perception: Natural 1</span>
        </div>

        <h1 class="error-title">Lost in the Mists</h1>
        
        <p class="error-description">
          The path you seek has been consumed by the dragon's fog. The page may have been moved, destroyed by a fireball, or never existed in this realm.
        </p>

        <!-- Navigation Actions -->
        <div class="error-actions">
          <a href="Dashboard.html" class="btn btn-primary btn-with-icon">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Return to Dashboard</span>
          </a>

          <a href="Index.html" class="btn btn-outline-crimson btn-with-icon">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home Page</span>
          </a>
        </div>

      </div>

      <!-- Footer Info -->
      <footer class="error-footer">
        <span>Need assistance? <a href="Login.html" class="auth-link">Contact Support</a></span>
      </footer>

    </section>
