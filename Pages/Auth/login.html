<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Fog of the Dragon</title>
  <link rel="stylesheet" href="../../Styles/auth.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><style>path{stroke:%231a1a1a}path.red{stroke:%23d62839}@media(prefers-color-scheme:dark){path:not(.red){stroke:%23ffffff}}</style><path d='M16 3L4 9L16 15L28 9L16 3Z' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4 17L16 23L28 17' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path class='red' d='M4 23L16 29L28 23' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

</head>
<body>

  <main class="auth-page">
    <div class="auth-background">
      <div class="auth-bg-glow"></div>
      <div class="auth-bg-grid"></div>
    </div>

    <section class="auth-container">
      
      <!-- FOD Brand Heading -->
      <a class="auth-brand" href="Login.html" aria-label="Fog of the Dragon Home">
        <span class="auth-brand-icon">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3L4 9L16 15L28 9L16 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17L16 23L28 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 23L16 29L28 23" stroke="#d62839" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        </span>
        <span class="auth-brand-text">Fog of the Dragon</span>
      </a>

      <!-- Authentication Card -->
      <div class="auth-card">
        
        <header class="auth-header">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Enter your credentials to continue your adventure.</p>
        </header>

        <form class="auth-form" action="#" method="POST">
          
          <div class="auth-field">
            <label for="login-email" class="auth-label">Email address</label>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              class="auth-input" 
              placeholder="you@example.com" 
              autocomplete="email" 
              required
            >
          </div>

          <div class="auth-field">
            <label for="login-password" class="auth-label">Password</label>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="auth-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required
            >
          </div>

          <div class="auth-options">
            <label class="auth-checkbox">
              <input type="checkbox" name="remember_me">
              <span class="auth-checkbox-mark"></span>
              <span class="auth-checkbox-text">Remember me</span>
            </label>
            <a href="#" class="auth-forgot">Forgot password?</a>
          </div>

          <button type="submit" class="auth-submit">Log In</button>

        </form>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <button type="button" class="auth-social">
          <svg class="auth-google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.2-.7-.4-1.5-.4-2.3z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <footer class="auth-footer">
          <span>Don't have an account?</span>
          <a href="Register.html" class="auth-link">Create one</a>
        </footer>

      </div>

    </section>
  </main>

</body>
</html>
