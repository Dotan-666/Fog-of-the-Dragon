<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a New Password — Fog of the Dragon</title>
  <link rel="stylesheet" href="../../Styles/auth.css">
  <link rel="stylesheet" href="../../Styles/theme.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><style>path{stroke:%231a1a1a}path.red{stroke:%23d62839}@media(prefers-color-scheme:dark){path:not(.red){stroke:%23ffffff}}</style><path d='M16 3L4 9L16 15L28 9L16 3Z' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4 17L16 23L28 17' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path class='red' d='M4 23L16 29L28 23' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

</head>
<body>

  <main class="auth-page">
    <div class="auth-background">
      <div class="auth-bg-glow"></div>
      <div class="auth-bg-grid"></div>
    </div>

    <section class="auth-container">
      
      <!-- FOD Brand Heading -->
      <a class="auth-brand" href="login.html" aria-label="Fog of the Dragon Home">
        <span class="auth-brand-icon">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3L4 9L16 15L28 9L16 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17L16 23L28 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 23L16 29L28 23" stroke="#d62839" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        </span>
        <span class="auth-brand-text">Fog of the Dragon</span>
      </a>

      <!-- Authentication Card -->
      <div class="auth-card">
        
        <!-- STATE 1: CHOOSE A NEW PASSWORD (shown once the reset link has signed the visitor in) -->
        <div id="new-password-state" class="auth-state hidden">
          <header class="auth-header">
            <h1 class="auth-title">Choose a new password</h1>
            <p class="auth-subtitle">Enter a new password for your account.</p>
          </header>

          <form class="auth-form" action="#" method="POST" novalidate>
            <div class="auth-field">
              <label for="new-password" class="auth-label">New password</label>
              <input
                type="password"
                id="new-password"
                name="password"
                class="auth-input"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
              >
            </div>

            <div class="auth-field">
              <label for="new-password-confirm" class="auth-label">Confirm new password</label>
              <input
                type="password"
                id="new-password-confirm"
                name="confirm_password"
                class="auth-input"
                placeholder="Repeat the new password"
                autocomplete="new-password"
                required
              >
            </div>

            <button type="submit" class="auth-submit">Save New Password</button>
          </form>
        </div>

        <!-- STATE 2: LINK MISSING, INVALID OR EXPIRED -->
        <div id="reset-link-problem-state" class="auth-state hidden">
          <header class="auth-header">
            <h1 class="auth-title">Reset link not valid</h1>
            <p class="auth-subtitle" id="reset-link-problem-text">This password reset link is invalid or has expired. Request a new one.</p>
          </header>
          <a class="auth-submit" href="forgot-password.html">Request a New Link</a>
        </div>

        <!-- STATE 0: CHECKING THE LINK -->
        <div id="reset-checking-state" class="auth-state">
          <header class="auth-header">
            <h1 class="auth-title">Checking your link…</h1>
            <p class="auth-subtitle">One moment.</p>
          </header>
        </div>

        <footer class="auth-footer">
          <a href="login.html" class="auth-link">← Back to Log In</a>
        </footer>

      </div>

    </section>
  </main>

  <!-- Supabase: pinned official client (integrity-checked), local config (git-ignored), shared client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="../../JS/config/supabase-config.js"></script>
  <script src="../../JS/supabase-client.js"></script>
  <script src="../../JS/fog-account.js"></script>
  <script src="../../JS/auth.js"></script>
</body>
</html>
