<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Fog of the Dragon</title>
  <link rel="stylesheet" href="../../Styles/auth.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><style>path{stroke:%231a1a1a}path.red{stroke:%23d62839}@media(prefers-color-scheme:dark){path:not(.red){stroke:%23ffffff}}</style><path d='M16 3L4 9L16 15L28 9L16 3Z' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M4 17L16 23L28 17' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path class='red' d='M4 23L16 29L28 23' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

</head>
<body>

  <main class="auth-page">
    <div class="auth-background">
      <div class="auth-bg-glow"></div>
      <div class="auth-bg-grid"></div>
    </div>

    <section class="auth-container">
      
      <!-- FOD Brand Heading -->
      <a class="auth-brand" href="Login.html" aria-label="Fog of the Dragon Home">
        <span class="auth-brand-icon">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 3L4 9L16 15L28 9L16 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17L16 23L28 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 23L16 29L28 23" stroke="#d62839" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        </span>
        <span class="auth-brand-text">Fog of the Dragon</span>
      </a>

      <!-- Authentication Card -->
      <div class="auth-card">
        
        <!-- STATE 1: REQUEST FORM -->
        <div id="reset-request-state" class="auth-state">
          <header class="auth-header">
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
          </header>

          <form class="auth-form" action="#" method="POST">
            <div class="auth-field">
              <label for="reset-email" class="auth-label">Email address</label>
              <input 
                type="email" 
                id="reset-email" 
                name="email" 
                class="auth-input" 
                placeholder="you@example.com" 
                autocomplete="email" 
                required
              >
            </div>

            <button type="submit" class="auth-submit">Send Reset Link</button>
          </form>
        </div>

        <!-- STATE 2: SUCCESS CONFIRMATION -->
        <div id="reset-success-state" class="auth-state auth-success-box">
          <div class="auth-success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>

          <header class="auth-header">
            <h2 class="auth-title">Check your email</h2>
            <p class="auth-subtitle">We've sent a password reset link to your email address if an account exists.</p>
          </header>

          <button type="button" class="auth-social">Resend Email</button>
        </div>

        <footer class="auth-footer">
          <a href="Login.html" class="auth-link">← Back to Log In</a>
        </footer>

      </div>

    </section>
  </main>

</body>
</html>
