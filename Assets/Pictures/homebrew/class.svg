<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Crossed swords">
  <!-- Fog of the Dragon homebrew art: class. Emblem: "Crossed swords" by Lorc, game-icons.net, CC BY 3.0. -->
  <defs>
    <radialGradient id="bg-class" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3d1c16"/>
